<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Modern Portal</title>
    <meta name="description" content="Secure login page built with Tailwind CSS">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Compiled Tailwind CSS -->
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-blue-600 selection:text-white">

    <!-- Navigation Bar -->
    <header>
        <nav class="bg-slate-900/80 backdrop-blur-md fixed w-full z-30 top-0 start-0 border-b border-slate-800">
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
                <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse group">
                    <img src="https://flowbite.com/docs/images/logo.svg" class="h-8 transition-transform group-hover:scale-105" alt="Flowbite Logo" />
                    <span class="self-center text-xl font-bold tracking-tight text-white">Flowbite</span>
                </a>

                <!-- Mobile Menu Button -->
                <button id="navbar-toggle-btn" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-slate-400 rounded-lg md:hidden hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-slate-700 transition" aria-controls="navbar-menu" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Navigation Links -->
                <div class="hidden w-full md:block md:w-auto" id="navbar-menu">
                    <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-slate-800 rounded-xl bg-slate-800/90 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-transparent items-center">
                        <li>
                            <a href="#" class="block py-2 px-3 text-white bg-blue-600 rounded-lg md:bg-transparent md:text-blue-400 md:p-0 font-medium" aria-current="page">Home</a>
                        </li>
                        <li class="relative w-full md:w-auto">
                            <button id="dropdown-toggle-btn" type="button" class="flex items-center justify-between w-full py-2 px-3 text-slate-300 rounded-lg hover:bg-slate-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-400 md:p-0 transition font-medium">
                                <span>Dropdown</span>
                                <svg id="dropdown-icon" class="w-4 h-4 ms-1.5 transition-transform duration-200" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
                                </svg>
                            </button>
                            <!-- Dropdown menu -->
                            <div id="dropdown-menu" class="hidden md:absolute z-50 mt-2 bg-slate-800 border border-slate-700 rounded-xl shadow-xl w-full md:w-48 overflow-hidden transition-all duration-200">
                                <ul class="py-2 text-sm text-slate-300">
                                    <li>
                                        <a href="#" class="block px-4 py-2 hover:bg-slate-700 hover:text-white transition">Dashboard</a>
                                    </li>
                                    <li>
                                        <a href="#" class="block px-4 py-2 hover:bg-slate-700 hover:text-white transition">Settings</a>
                                    </li>
                                    <li>
                                        <a href="#" class="block px-4 py-2 hover:bg-slate-700 hover:text-white transition">Earnings</a>
                                    </li>
                                    <li class="border-t border-slate-700/60 my-1"></li>
                                    <li>
                                        <a href="#" class="block px-4 py-2 text-red-400 hover:bg-red-500/10 hover:text-red-300 transition">Sign out</a>
                                    </li>
                                </ul>
                            </div>
                        </li>
                        <li>
                            <a href="#" class="block py-2 px-3 text-slate-300 rounded-lg hover:bg-slate-700 md:hover:bg-transparent md:hover:text-blue-400 md:p-0 transition">Services</a>
                        </li>
                        <li>
                            <a href="#" class="block py-2 px-3 text-slate-300 rounded-lg hover:bg-slate-700 md:hover:bg-transparent md:hover:text-blue-400 md:p-0 transition">Pricing</a>
                        </li>
                        <li>
                            <a href="#" class="block py-2 px-3 text-slate-300 rounded-lg hover:bg-slate-700 md:hover:bg-transparent md:hover:text-blue-400 md:p-0 transition">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content: Login Form -->
    <main class="flex-1 flex items-center justify-center pt-28 pb-36 px-4 relative z-10">
        <div class="w-full max-w-md bg-slate-800/85 backdrop-blur-xl border border-slate-700/80 shadow-2xl rounded-2xl p-6 sm:p-8 transition-all hover:border-slate-600">
            <!-- Header -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 mb-3 shadow-inner">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
                <p class="text-sm text-slate-400 mt-1">Please enter your credentials to login</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); alert('Signed in successfully!');">
                <!-- Username / Email -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Username or Email</label>
                    <div class="relative">
                        <input 
                            type="email" 
                            id="username" 
                            name="username" 
                            required 
                            placeholder="name@example.com"
                            class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                        />
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="text-sm font-medium text-slate-300">Password</label>
                        <a href="#" class="text-xs text-blue-400 hover:text-blue-300 hover:underline transition">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="••••••••"
                            class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                        />
                    </div>
                </div>

                <!-- Remember Me & Terms -->
                <div class="flex items-center">
                    <input id="remember-me" type="checkbox" class="w-4 h-4 text-blue-600 bg-slate-900 border-slate-700 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer">
                    <label for="remember-me" class="ms-2 text-sm text-slate-400 cursor-pointer select-none">Remember me</label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submit-button" 
                    class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/25 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-800 transition duration-150"
                >
                    Sign in to account
                </button>
            </form>

            <!-- Bottom Link -->
            <p class="text-center text-sm text-slate-400 mt-6">
                Don't have an account? 
                <a href="#" class="text-blue-400 hover:text-blue-300 font-medium hover:underline transition">Sign up</a>
            </p>
        </div>
    </main>

    <!-- Decorative Wave SVG at Bottom -->
    <div class="fixed bottom-0 left-0 w-full pointer-events-none z-0 opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" class="w-full h-auto">
            <path fill="#2563eb" fill-opacity="1" d="M0,32L26.7,48C53.3,64,107,96,160,96C213.3,96,267,64,320,58.7C373.3,53,427,75,480,101.3C533.3,128,587,160,640,154.7C693.3,149,747,107,800,106.7C853.3,107,907,149,960,160C1013.3,171,1067,149,1120,117.3C1173.3,85,1227,43,1280,26.7C1333.3,11,1387,21,1413,26.7L1440,32L1440,320L1413.3,320C1386.7,320,1333,320,1280,320C1226.7,320,1173,320,1120,320C1066.7,320,1013,320,960,320C906.7,320,853,320,800,320C746.7,320,693,320,640,320C586.7,320,533,320,480,320C426.7,320,373,320,320,320C266.7,320,213,320,160,320C106.7,320,53,320,27,320L0,320Z"></path>
        </svg>
    </div>

    <!-- Interactive script for menu and dropdown -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navbarToggle = document.getElementById('navbar-toggle-btn');
            const navbarMenu = document.getElementById('navbar-menu');
            const dropdownBtn = document.getElementById('dropdown-toggle-btn');
            const dropdownMenu = document.getElementById('dropdown-menu');
            const dropdownIcon = document.getElementById('dropdown-icon');

            if (navbarToggle && navbarMenu) {
                navbarToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navbarMenu.classList.toggle('hidden');
                    const expanded = navbarToggle.getAttribute('aria-expanded') === 'true';
                    navbarToggle.setAttribute('aria-expanded', !expanded);
                });
            }

            if (dropdownBtn && dropdownMenu) {
                dropdownBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('hidden');
                    dropdownIcon.classList.toggle('rotate-180');
                });
            }

            // Close dropdown and mobile menu when clicking outside
            document.addEventListener('click', (e) => {
                if (dropdownMenu && !dropdownMenu.contains(e.target) && !dropdownBtn.contains(e.target)) {
                    dropdownMenu.classList.add('hidden');
                    if (dropdownIcon) dropdownIcon.classList.remove('rotate-180');
                }
                if (navbarMenu && !navbarMenu.contains(e.target) && !navbarToggle.contains(e.target)) {
                    if (window.innerWidth < 768) {
                        navbarMenu.classList.add('hidden');
                        if (navbarToggle) navbarToggle.setAttribute('aria-expanded', 'false');
                    }
                }
            });
        });
    </script>
</body>
</html>
